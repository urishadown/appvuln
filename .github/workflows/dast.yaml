name: DAST Completo - Banco


on:

  push:

    branches:

      - dast


  workflow_dispatch:


jobs:

  preparar-alvo-e-scan:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout

        uses: actions/checkout@v4


      - name: Subir Juice Shop

        run: |

          docker run -d -p 3000:3000 --name alvo bkimminich/juice-shop

          sleep 30


      - name: Nikto (higiene do servidor)

        run: |

          docker run --network host frapsoft/nikto \

          -h http://localhost:3000 || true


      - name: Nuclei (falhas conhecidas)

        uses: projectdiscovery/nuclei-action@main

        with:

          target: http://localhost:3000


      - name: ZAP Baseline (análise DAST)

        uses: zaproxy/action-baseline@v0.12.0

        with:

          target: 'http://localhost:3000'
